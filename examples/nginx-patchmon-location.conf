# Optional PatchMon reverse-proxy location example.
# Add INSIDE PatchMon's existing HTTPS server block; do not create a
# duplicate 443 listener, replace Certbot-managed TLS, or remove GeoIP guard.
# PatchMon remains a separate Docker installation, not part of NetSec.
#
# The host-side CA+US GeoIP guard is enforced at server{} scope.
# Verify auth/cookies/WebSocket behavior on the actual installed version.
location / {
    proxy_pass http://REPLACE_WITH_PRIVATE_PATCHMON_IP:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 3600s;
}
