# Place inside your NetSec HTTPS Nginx server{} block, after setting
# auth_basic_user_file. Do not place in an unauthenticated vhost.
location / {
    auth_basic "NetSec Security Dashboard";
    auth_basic_user_file /etc/nginx/.htpasswd-netsec;
    proxy_pass http://REPLACE_WITH_LXC_IP:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-NetSec-Authenticated-User $remote_user;
    proxy_set_header Authorization "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}
