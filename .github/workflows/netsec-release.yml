name: NetSec CI and verified release ZIP

on:
  push:
    branches: [main, develop/v1.2.0]
    tags: ['v1.*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python and installer regressions
        run: |
          bash ci/check.sh
          bash -n scripts/install-lxc.sh scripts/proxmox-setup.sh
          bash ci/check-ui.sh
      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"

  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble complete versioned source archive
        run: |
          VERSION="$(cat VERSION)"
          git archive --format=zip --prefix="netsec-v${VERSION}/" HEAD -o "netsec-v${VERSION}-source.zip"
          sha256sum "netsec-v${VERSION}-source.zip" | tee SHA256SUMS.txt
      - name: Publish stable release and SHA-256 manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat VERSION)"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "netsec-v${VERSION}-source.zip" SHA256SUMS.txt --clobber
          else
            gh release create "v${VERSION}" "netsec-v${VERSION}-source.zip" SHA256SUMS.txt \
              --title "NetSec v${VERSION}" --generate-notes --verify-tag
          fi
